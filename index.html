<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>拆迁小队 - 拉砖块拆楼打僵尸闯关小游戏</title>
  <meta name="description" content="免费在线休闲闯关游戏：用吊车钩子拉出建筑砖块引发坍塌，砖块变成投掷弹药，自动迎战一波波僵尸，还有BOSS关卡。拉砖块拆迁，守住海滩！" />
  <meta name="keywords" content="拉砖块,拆楼游戏,闯关游戏,休闲游戏,免费小游戏,僵尸,拆迁,HTML5游戏" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stage">
    <canvas id="game" width="960" height="540"></canvas>

    <div id="hud" class="hidden">
      <div class="hgroup" id="hLevel">关卡</div>
      <div class="hgroup" id="hHooks">钩子 ×0</div>
      <div class="hgroup" id="hBricks">砖块 ×0</div>
      <div class="hgroup" id="hEnemy">僵尸 ×0</div>
      <div class="hgroup" id="hpWrap">
        <span>小人</span>
        <div id="hpBar"><div id="hpFill"></div></div>
      </div>
      <button id="pauseBtn" class="hbtn">暂停</button>
    </div>

    <button id="skillBtn" class="hidden">
      <span class="skill-label">火箭</span>
      <span id="skillCount">×1</span>
    </button>

    <div id="overlay" class="hidden"></div>
  </div>

  <script src="js/levels.js?v=4"></script>
  <script src="js/audio.js?v=4"></script>
  <script src="js/game.js?v=4"></script>
</body>
</html>
